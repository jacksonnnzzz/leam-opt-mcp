name: Bug report
description: Report a reproducible defect without attaching secrets or proprietary projects.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste API keys, license files, proprietary PDFs, or private `.aedt` projects.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include redacted commands, input schema, and traceback.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: antenna-doctor output
      description: This output reports only credential presence, not values. Review it before posting.
      render: json
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, license data, proprietary attachments, and personal paths.
          required: true
